# GitHub Actions CI/CD Pipeline for ASP.NET Core
# Place this file in: .github/workflows/ci-cd.yml

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: Release

jobs:
  # Job 1: Build and Test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run unit tests
        run: |
          dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./coverage/

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-reports
          path: '**/coverage/*.opencover.xml'

      - name: Publish code coverage
        uses: codecov/codecov-action@v3
        with:
          files: '**/coverage/*.opencover.xml'
          flags: unittests
          name: codecov-umbrella

      - name: Check code coverage threshold
        run: |
          # Extract line coverage percentage
          coverage=$(grep -oP 'line-rate="\K[^"]+' coverage/coverage.opencover.xml | head -1)
          coverage_percent=$(echo "$coverage * 100" | bc)

          echo "Code coverage: $coverage_percent%"

          # Fail if below 85%
          if (( $(echo "$coverage_percent < 85" | bc -l) )); then
            echo "❌ Code coverage ($coverage_percent%) is below threshold (85%)"
            exit 1
          else
            echo "✅ Code coverage ($coverage_percent%) meets threshold (85%)"
          fi

  # Job 2: Code Quality Analysis
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Code Analysis
        run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest

      - name: Install ReSharper CLI
        run: dotnet tool install --global JetBrains.ReSharper.GlobalTools

      - name: Run ReSharper InspectCode
        run: jb inspectcode *.sln --output=resharper-report.xml --no-build

      - name: Upload ReSharper report
        uses: actions/upload-artifact@v3
        with:
          name: resharper-report
          path: resharper-report.xml

  # Job 3: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Security Scan with Snyk
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'ProductCatalogAPI'
          path: '.'
          format: 'HTML'

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v3
        with:
          name: owasp-dependency-check
          path: dependency-check-report.html

  # Job 4: Docker Build (if using containers)
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.CONTAINER_REGISTRY }}/productcatalogapi
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.CONTAINER_REGISTRY }}/productcatalogapi:buildcache
          cache-to: type=registry,ref=${{ secrets.CONTAINER_REGISTRY }}/productcatalogapi:buildcache,mode=max

  # Job 5: Deploy to Development
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://dev-api.example.com

    steps:
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'productcatalog-api-dev'
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          images: '${{ secrets.CONTAINER_REGISTRY }}/productcatalogapi:develop'

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against https://dev-api.example.com"
          # Add actual smoke test commands
          curl -f https://dev-api.example.com/health || exit 1

  # Job 6: Deploy to Production
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.example.com

    steps:
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'productcatalog-api-prod'
          slot-name: 'staging'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          images: '${{ secrets.CONTAINER_REGISTRY }}/productcatalogapi:main'

      - name: Run smoke tests on staging
        run: |
          echo "Running smoke tests on staging slot"
          curl -f https://productcatalog-api-prod-staging.azurewebsites.net/health || exit 1

      - name: Swap staging to production
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az webapp deployment slot swap \
              --resource-group productcatalog-rg \
              --name productcatalog-api-prod \
              --slot staging \
              --target-slot production

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment"
          curl -f https://api.example.com/health || exit 1

  # Job 7: Notification
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, security-scan]
    if: always()

    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            CI/CD Pipeline: ${{ job.status }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()
